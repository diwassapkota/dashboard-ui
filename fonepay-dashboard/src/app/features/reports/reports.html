<div class="gap-1 px-6 flex flex-1 justify-center py-5">
    <div class="layout-content-container flex flex-col w-80">
        <h2 class="text-[#1c0d0e] text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5">Create Report</h2>
        <form [formGroup]="reportForm" (ngSubmit)="createReport()" class="space-y-4 p-4">
            <label class="flex flex-col">
                <span class="text-[#1c0d0e] text-sm font-medium">Title</span>
                <input
                        formControlName="title"
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#1c0d0e] focus:outline-0 focus:ring-0 border border-[#e8ced0] bg-[#fcf8f8] focus:border-[#e8ced0] h-10 placeholder:text-[#9c494e] p-[15px] text-base font-normal leading-normal"
                />
            </label>
            <label class="flex flex-col">
                <span class="text-[#1c0d0e] text-sm font-medium">Type</span>
                <input
                        formControlName="type"
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#1c0d0e] focus:outline-0 focus:ring-0 border border-[#e8ced0] bg-[#fcf8f8] focus:border-[#e8ced0] h-10 placeholder:text-[#9c494e] p-[15px] text-base font-normal leading-normal"
                />
            </label>
            <button
                    type="submit"
                    [disabled]="reportForm.invalid"
                    class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-[#df0c17] text-[#fcf8f8] text-sm font-bold leading-normal tracking-[0.015em]"
            >
                <span class="truncate">Create</span>
            </button>
        </form>
    </div>
    <div class="layout-content-container flex flex-col max-w-[960px] flex-1">
        <div class="flex flex-wrap justify-between gap-3 p-4"><p class="text-[#1c0d0e] tracking-light text-[32px] font-bold leading-tight min-w-72">Reports</p></div>
        <div class="px-4 py-3 @container">
            <div class="flex overflow-hidden rounded-lg border border-[#e8ced0] bg-[#fcf8f8]">
                <table class="flex-1">
                    <thead>
                    <tr class="bg-[#fcf8f8]">
                        <th class="px-4 py-3 text-left text-[#1c0d0e] text-sm font-medium leading-normal">Title</th>
                        <th class="px-4 py-3 text-left text-[#1c0d0e] text-sm font-medium leading-normal">Type</th>
                        <th class="px-4 py-3 text-left text-[#1c0d0e] text-sm font-medium leading-normal">Created At</th>
                        <th class="px-4 py-3 text-left text-[#1c0d0e] text-sm font-medium leading-normal">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr *ngFor="let report of reports" class="border-t border-t-[#e8ced0]">
                        <td class="h-[72px] px-4 py-2 text-[#9c494e] text-sm font-normal leading-normal">{{ report.title }}</td>
                        <td class="h-[72px] px-4 py-2 text-[#9c494e] text-sm font-normal leading-normal">{{ report.type }}</td>
                        <td class="h-[72px] px-4 py-2 text-[#9c494e] text-sm font-normal leading-normal">{{ report.createdAt | date: 'medium' }}</td>
                        <td class="h-[72px] px-4 py-2 text-[#9c494e] text-sm font-normal leading-normal">
                            <button (click)="deleteReport(report.id)" class="text-red-500">Delete</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
