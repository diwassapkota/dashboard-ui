<div class="gap-1 px-6 flex flex-1 justify-center py-5">
    <div class="layout-content-container flex flex-col w-80">
        <h2 class="text-[#1c0d0e] text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5">Create Report</h2>
        <form [formGroup]="reportForm" (ngSubmit)="createReport()" class="space-y-4 p-4">
            <label class="flex flex-col">
                <span class="text-[#1c0d0e] text-sm font-medium">Title</span>
                <input
                        formControlName="title"
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#1c0d0e] focus:outline-0 focus:ring-0 border border-[#e8ced0] bg-[#fcf8f8] focus:border-[#e8ced0] h-10 placeholder:text-[#9c494e] p-[15px] text-base font-normal leading-normal"
                />
            </label>
            <label class="flex flex-col">
                <span class="text-[#1c0d0e] text-sm font-medium">Type</span>
                <input
                        formControlName="type"
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#1c0d0e] focus:outline-0 focus:ring-0 border border-[#e8ced0] bg-[#fcf8f8] focus:border-[#e8ced0] h-10 placeholder:text-[#9c494e] p-[15px] text-base font-normal leading-normal"
                />
            </label>
            <button
                    type="submit"
                    [disabled]="reportForm.invalid"
                    class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-[#df0c17] text-[#fcf8f8] text-sm font-bold leading-normal tracking-[0.015em]"
            >
                <span class="truncate">Create</span>
            </button>
        </form>
    </div>
    <div class="layout-content-container flex flex-col max-w-[960px] flex-1">
        <div class="flex flex-wrap justify-between gap-3 p-4"><p class="text-[#1c0d0e] tracking-light text-[32px] font-bold leading-tight min-w-72">All Transactions</p></div>
        <div class="flex justify-between gap-2 px-4 py-3">
            <div class="flex gap-2">
                <button class="p-2 text-[#1c0d0e]">
                    <div class="text-[#1c0d0e]" data-icon="DownloadSimple" data-size="24px" data-weight="regular">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                            <path
                                    d="M224,152v56a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V152a8,8,0,0,1,16,0v56H208V152a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,132.69V40a8,8,0,0,0-16,0v92.69L93.66,106.34a8,8,0,0,0-11.32,11.32Z"
                            ></path>
                        </svg>
                    </div>
                </button>
                <button class="p-2 text-[#1c0d0e]">
                    <div class="text-[#1c0d0e]" data-icon="File" data-size="24px" data-weight="regular">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                            <path
                                    d="M213.66,82.34l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V88A8,8,0,0,0,213.66,82.34ZM160,51.31,188.69,80H160ZM200,216H56V40h88V88a8,8,0,0,0,8,8h48V216Z"
                            ></path>
                        </svg>
                    </div>
                </button>
            </div>
            <button
                    class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#df0c17] text-[#fcf8f8] gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-4"
            >
                <div class="text-[#fcf8f8]" data-icon="DownloadSimple" data-size="20px" data-weight="fill">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor" viewBox="0 0 256 256">
                        <path
                                d="M82.34,117.66A8,8,0,0,1,88,104h32V40a8,8,0,0,1,16,0v64h32a8,8,0,0,1,5.66,13.66l-40,40a8,8,0,0,1-11.32,0ZM216,144a8,8,0,0,0-8,8v56H48V152a8,8,0,0,0-16,0v56a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V152A8,8,0,0,0,216,144Z"
                        ></path>
                    </svg>
                </div>
                <span class="truncate">Export</span>
            </button>
        </div>
        <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
            <label class="flex flex-col min-w-40 flex-1">
                <input
                        placeholder="Search"
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#1c0d0e] focus:outline-0 focus:ring-0 border border-[#e8ced0] bg-[#fcf8f8] focus:border-[#e8ced0] h-14 placeholder:text-[#9c494e] p-[15px] text-base font-normal leading-normal"
                        value=""
                />
            </label>
        </div>
        <div class="flex gap-3 p-3 flex-wrap pr-4">
            <button class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-[#f4e7e7] pl-4 pr-2">
                <p class="text-[#1c0d0e] text-sm font-medium leading-normal">Date</p>
                <div class="text-[#1c0d0e]" data-icon="CaretDown" data-size="20px" data-weight="regular">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor" viewBox="0 0 256 256">
                        <path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path>
                    </svg>
                </div>
            </button>
            <button class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-[#f4e7e7] pl-4 pr-2">
                <p class="text-[#1c0d0e] text-sm font-medium leading-normal">Status</p>
                <div class="text-[#1c0d0e]" data-icon="CaretDown" data-size="20px" data-weight="regular">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor" viewBox="0 0 256 256">
                        <path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path>
                    </svg>
                </div>
            </button>
            <button class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-[#f4e7e7] pl-4 pr-2">
                <p class="text-[#1c0d0e] text-sm font-medium leading-normal">Amount</p>
                <div class="text-[#1c0d0e]" data-icon="CaretDown" data-size="20px" data-weight="regular">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor" viewBox="0 0 256 256">
                        <path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path>
                    </svg>
                </div>
            </button>
        </div>
        <div class="px-4 py-3 @container">
            <div class="flex overflow-hidden rounded-lg border border-[#e8ced0] bg-[#fcf8f8]">
                <table class="flex-1">
                    <thead>
                    <tr class="bg-[#fcf8f8]">
                        <th class="px-4 py-3 text-left text-[#1c0d0e] text-sm font-medium leading-normal">Title</th>
                        <th class="px-4 py-3 text-left text-[#1c0d0e] text-sm font-medium leading-normal">Type</th>
                        <th class="px-4 py-3 text-left text-[#1c0d0e] text-sm font-medium leading-normal">Created At</th>
                        <th class="px-4 py-3 text-left text-[#1c0d0e] text-sm font-medium leading-normal">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr *ngFor="let report of reports" class="border-t border-t-[#e8ced0]">
                        <td class="h-[72px] px-4 py-2 text-[#9c494e] text-sm font-normal leading-normal">{{ report.title }}</td>
                        <td class="h-[72px] px-4 py-2 text-[#9c494e] text-sm font-normal leading-normal">{{ report.type }}</td>
                        <td class="h-[72px] px-4 py-2 text-[#9c494e] text-sm font-normal leading-normal">{{ report.createdAt | date: 'medium' }}</td>
                        <td class="h-[72px] px-4 py-2 text-[#9c494e] text-sm font-normal leading-normal">
                            <button (click)="deleteReport(report.id)" class="text-red-500">Delete</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
