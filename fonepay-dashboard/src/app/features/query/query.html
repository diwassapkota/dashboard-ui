<div class="gap-1 px-6 flex flex-1 justify-center py-5">
    <div class="layout-content-container flex flex-col w-80">
        <h3 class="text-[#1c0d0e] text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-4">Query History</h3>
        <div *ngFor="let item of history" class="flex items-center gap-4 bg-[#fcf8f8] px-4 min-h-[72px] py-2">
            <div class="text-[#1c0d0e] flex items-center justify-center rounded-lg bg-[#f4e7e7] shrink-0 size-12" data-icon="Clock" data-size="24px" data-weight="regular">
                <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                    <path
                            d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z"
                    ></path>
                </svg>
            </div>
            <div class="flex flex-col justify-center">
                <p class="text-[#1c0d0e] text-base font-medium leading-normal line-clamp-1">{{ item.queryText }}</p>
                <p class="text-[#9c494e] text-sm font-normal leading-normal line-clamp-2">{{ item.executedAt | date:'medium' }}</p>
            </div>
        </div>
    </div>
    <div class="layout-content-container flex flex-col max-w-[960px] flex-1">
        <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
            <label class="flex flex-col min-w-40 flex-1">
                <p class="text-[#1c0d0e] text-base font-medium leading-normal pb-2">Query Editor</p>
                <textarea
                        [(ngModel)]="query"
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#1c0d0e] focus:outline-0 focus:ring-0 border border-[#e8ced0] bg-[#fcf8f8] focus:border-[#e8ced0] min-h-36 placeholder:text-[#9c494e] p-[15px] text-base font-normal leading-normal"
                ></textarea>
            </label>
        </div>
        <div class="flex px-4 py-3 justify-end">
            <button
                    (click)="executeQuery()"
                    class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-[#df0c17] text-[#fcf8f8] text-sm font-bold leading-normal tracking-[0.015em]"
            >
                <span class="truncate">Run Query</span>
            </button>
        </div>
        <h3 class="text-[#1c0d0e] text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-4">Query Results</h3>
        <div *ngIf="error" class="text-red-500 p-4">{{ error }}</div>
        <div *ngIf="results" class="px-4 py-3 @container">
            <div class="flex overflow-hidden rounded-lg border border-[#e8ced0] bg-[#fcf8f8]">
                <table class="flex-1">
                    <thead>
                    <tr class="bg-[#fcf8f8]">
                        <th *ngFor="let col of objectKeys(results[0])" class="px-4 py-3 text-left text-[#1c0d0e] text-sm font-medium leading-normal">
                            {{ col }}
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr *ngFor="let row of results" class="border-t border-t-[#e8ced0]">
                        <td *ngFor="let col of objectKeys(row)" class="h-[72px] px-4 py-2 text-[#1c0d0e] text-sm font-normal leading-normal">
                            {{ row[col] }}
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
