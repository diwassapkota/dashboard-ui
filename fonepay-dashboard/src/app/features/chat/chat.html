<div class="flex h-screen">
  <!-- Sidebar -->
  <div class="w-1/4 bg-[#fcf8f8] p-4 overflow-y-auto border-r border-gray-200">
    <h2 class="text-xl font-bold mb-4 text-[#1c0d0e]">Conversations</h2>
    <ul>
      <li *ngFor="let conv of conversations" (click)="selectConversation(conv)" class="p-2 hover:bg-[#f3e7e8] cursor-pointer rounded text-[#1c0d0e]">
        {{ conv.title || 'Conversation ' + conv.id }}
      </li>
    </ul>
  </div>

  <!-- Main Chat Area -->
  <div class="w-3/4 flex flex-col">
    <!-- Message Display Area -->
    <div #scrollMe class="flex-1 overflow-y-auto p-6">
        <div *ngFor="let message of messages" class="flex items-end gap-3 p-4" [ngClass]="{'justify-end': message.sender === 'You'}">
            <div *ngIf="message.sender !== 'You'"
                    class="bg-center bg-no-repeat aspect-square bg-cover rounded-full w-10 shrink-0"
                    style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAVCtYfscsJ51BBoWLYKQ8LnhrUhOf8MZHz0cEkeZ-9LHqfFzIhT6yMX6tXVof6hieChvUTQyLyu-k9p22upERdfzq7GEvTFM34TFvFCpfzxWD3mEYjfoNxTrqRwlpxaSaTu6HkqjYwZm9gQZOMmZqT8zJ5hjipqZ9ijwOJM_4IUqxE02t2N5d9ArEoPb1XzZf3tk6dtX2Enuj9CLXthZXlYREL6mD2pgwZbDIAMTM7B_-aLYBHhA3dy1MDQr4le33TdPV8Nqp2F5hq");'
            ></div>
            <div class="flex flex-1 flex-col gap-1" [ngClass]="{'items-end': message.sender === 'You', 'items-start': message.sender !== 'You'}">
                <p class="text-[#9c494e] text-[13px] font-normal leading-normal max-w-[360px]">{{ message.sender }}</p>
                <p class="text-base font-normal leading-normal flex max-w-[360px] rounded-lg px-4 py-3" [ngClass]="{'bg-[#df0c17] text-[#fcf8f8]': message.sender === 'You', 'bg-[#f4e7e7] text-[#1c0d0e]': message.sender !== 'You'}">
                    {{ message.message }}
                </p>
            </div>
            <div *ngIf="message.sender === 'You'"
                    class="bg-center bg-no-repeat aspect-square bg-cover rounded-full w-10 shrink-0"
                    style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCgoWHFuWWDi38q_AhNCnEEWVkwheK6L0I2Gmq5z5-5Uj5rKsCzYiLYXw3eV_p0wNzJtvEo2Cup5GdoFJ9-KkkVJW4C8tkHVzHvlmED_z4KzxqLabYd8qyhr7dJzyzTPNn95v7m4SdOrz2qBEyWDNvyJQRFksFao0IyX1ctsQoMJfqU1fbas0tpCu1jzfOXhNG1w7rxzcaJBKE59O1iyPK_88ubOaGWFRcRk9hjq2oe41YXdv1MMbQa4Sm_Yvjv8qZvR8EFRgk1fRjm");'
            ></div>
        </div>
    </div>

    <!-- Message Input Area -->
    <div class="p-4 bg-white border-t border-gray-200">
        <div class="flex items-center gap-3">
            <input
                    [(ngModel)]="newMessage"
                    (keyup.enter)="sendMessage()"
                    placeholder="Type your message..."
                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#1c0d0e] focus:outline-0 focus:ring-0 border border-gray-300 bg-gray-50 h-12 placeholder:text-[#9c494e] px-4 text-base font-normal leading-normal"
            />
            <button
                    (click)="sendMessage()"
                    class="min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-4 bg-[#df0c17] text-[#fcf8f8] text-sm font-bold leading-normal"
            >
                <span class="truncate">Send</span>
            </button>
        </div>
    </div>
  </div>
</div>
