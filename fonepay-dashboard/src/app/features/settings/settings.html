<div class="px-40 flex flex-1 justify-center py-5">
    <div class="layout-content-container flex flex-col max-w-[960px] flex-1">
        <div class="flex flex-wrap justify-between gap-3 p-4">
            <div class="flex min-w-72 flex-col gap-3">
                <p class="text-[#1b0e0e] tracking-light text-[32px] font-bold leading-tight">Settings</p>
                <p class="text-[#994d51] text-sm font-normal leading-normal">Manage your profile, security, theme settings, and preferences.</p>
            </div>
        </div>
        <form [formGroup]="settingsForm" (ngSubmit)="updateSettings()">
            <h2 class="text-[#1b0e0e] text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5">Theme</h2>
            <div class="flex items-center gap-4 bg-[#fcf8f8] px-4 min-h-[72px] py-2">
                <div class="flex flex-col justify-center">
                    <p class="text-[#1b0e0e] text-base font-medium leading-normal line-clamp-1">Theme Settings</p>
                    <p class="text-[#994d51] text-sm font-normal leading-normal line-clamp-2">Choose between light and dark themes for the application.</p>
                </div>
                <select formControlName="theme" class="form-select rounded-lg border border-[#e8ced0] bg-[#fcf8f8] text-[#1c0d0e] h-10 px-3">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>
            <h2 class="text-[#1b0e0e] text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5">Preferences</h2>
            <div class="flex items-center gap-4 bg-[#fcf8f8] px-4 min-h-[72px] py-2">
                <div class="flex flex-col justify-center">
                    <p class="text-[#1b0e0e] text-base font-medium leading-normal line-clamp-1">Notification Preferences</p>
                    <p class="text-[#994d51] text-sm font-normal leading-normal line-clamp-2">Manage your notification preferences to stay informed.</p>
                </div>
                <textarea formControlName="preferences" class="form-textarea rounded-lg border border-[#e8ced0] bg-[#fcf8f8] text-[#1c0d0e] p-3" rows="3"></textarea>
            </div>
            <div class="flex px-4 py-3 justify-end">
                <button
                        type="submit"
                        class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-[#df0c17] text-[#fcf8f8] text-sm font-bold leading-normal tracking-[0.015em]"
                >
                    <span class="truncate">Save Changes</span>
                </button>
            </div>
        </form>
    </div>
</div>
